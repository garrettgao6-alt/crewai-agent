name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing server connection
        shell: bash
        env:
          SERVER_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -T 10 -H 209.38.93.248 >> ~/.ssh/known_hosts
      - name: Back up or release exact commit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          remote_script="/root/gao-release-${RELEASE_SHA}.sh"
          scp -o ConnectTimeout=15 -i ~/.ssh/server_key deploy/production_release.sh "root@209.38.93.248:${remote_script}"
          mode=backup
          if [ "$EVENT" = push ]; then mode=deploy; fi
          ssh -o ConnectTimeout=15 -i ~/.ssh/server_key root@209.38.93.248 bash "$remote_script" "$mode" "$RELEASE_SHA"
