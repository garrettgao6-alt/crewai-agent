name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation (verify does not change the server)
        type: choice
        options: [verify, backup, deploy]
        default: verify
permissions:
  contents: read
concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile application and release scripts
        run: |
          python -m compileall -q api.py streamlit_app.py core deploy
          bash -n deploy/production_release.sh
          bash -n deploy/github_release.sh
      - name: Run regression tests
        run: python -m pytest -q
  deploy:
    name: Production connection and release
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate SSH identity, authenticate, then back up or release
        env:
          SERVER_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode="${REQUESTED_OPERATION:-verify}"
          if [ "$EVENT_NAME" = push ]; then mode=deploy; fi
          bash deploy/github_release.sh "$mode" "$RELEASE_SHA"
