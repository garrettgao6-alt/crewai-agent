name: Storage maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-main
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Inspect approved construction storage volume
        env:
          SERVER_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$keydir/identity"
          unset SERVER_KEY
          chmod 600 "$keydir/identity"
          ssh-keygen -y -P '' -f "$keydir/identity" > /dev/null
          ssh-keyscan -T 15 -t ed25519 209.38.93.248 > "$keydir/known_hosts" 2>/dev/null
          python3 - "$keydir/known_hosts" <<'HOSTCHECK'
          import pathlib,sys,hashlib,base64
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines();assert len(lines)==1
          host,kind,key=lines[0].split();assert host=='209.38.93.248' and kind=='ssh-ed25519'
          assert hashlib.sha256(base64.b64decode(key)).hexdigest()=='81647e644f59cd3f4485129bc7695536eb0bd5e6bd4ce55b492c0df163f83d22'
          HOSTCHECK
          opts=(-i "$keydir/identity" -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$keydir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${opts[@]}" root@209.38.93.248 "python3 -" <<'REMOTE'
          import pathlib,subprocess,json,shutil,sys,os,stat
          volume=pathlib.Path('/dev/disk/by-id/scsi-0DO_Volume_gao-storage-syd1')
          assert volume.exists() and stat.S_ISBLK(volume.stat().st_mode),'Expected new volume not found'
          def run(args):return subprocess.run(args,capture_output=True,text=True)
          def usage(p):
           d=shutil.disk_usage(p);return {'total_mb':d.total//2**20,'free_mb':d.free//2**20}
          report={'root':usage('/'),'device':str(volume.resolve()),'filesystem':run(['blkid','-s','TYPE','-o','value',str(volume)]).stdout.strip(),'mount':run(['findmnt','-rn','-S',str(volume),'-o','TARGET,FSTYPE,UUID,OPTIONS']).stdout.strip(),'rsync_available':bool(shutil.which('rsync')),'active_runtime':str(pathlib.Path('/root/crewai-agent/venv').resolve()),'directories':{}}
          for name in ['/root/gao-releases','/root/gao-backups']:
           p=pathlib.Path(name)
           result=run(['du','-sx','--block-size=1',name]);size=int(result.stdout.split()[0])
           report['directories'][name]={'bytes':size,'is_symlink':p.is_symlink(),'resolved':str(p.resolve())}
           if name.endswith('gao-releases'):
            report['releases']=[{'name':x.name,'mb':int(run(['du','-sx','--block-size=1',str(x)]).stdout.split()[0])//2**20} for x in p.iterdir() if x.is_dir()]
          print('STORAGE_INSPECTION '+json.dumps(report),flush=True)
          REMOTE
